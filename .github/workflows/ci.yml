name: ci
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build plugin
        uses: ./.github/actions/build-plugin

      - name: Format
        run: bun format:check

      - name: Lint
        run: bun lint

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: sharkord-lava-plugin
          path: dist/sharkord-lava-plugin
